# Example inventory for the AWS Terraform plan (Terraform/aws).
# The SSH key pair is generated by Terraform and written to ~/.ssh/kasm-lab
# (configurable with the ssh_key_path variable).
# Fill in the manager's public IP (terraform output manager_ip) and the
# worker private IPs (terraform output worker_private_ips); workers are
# only reachable from the manager, so run k3s-worker.yml from the manager.
kasm-workers:
  children:
    managers:
      hosts:
        203.0.113.10: # manager public IP (terraform output manager_ip)
    workers:
      hosts:
        10.0.2.61: # worker private IPs (terraform output worker_private_ips)
        10.0.2.19:
        10.0.2.144:
  vars:
    ansible_user: kasm
    ansible_ssh_private_key_file: ~/.ssh/kasm-lab
    ansible_ssh_common_args: "-o IdentitiesOnly=yes"
